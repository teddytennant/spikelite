[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spikelite"
version = "0.1.0"
description = "JAX kernel of SpikeLite for multivariate forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "jax",
    "equinox",
    "optax",
]

[project.optional-dependencies]
tests = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
